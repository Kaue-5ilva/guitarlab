name: Publicar GuitarLab no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Extrair o site
        run: |
          rm -rf _site guitarlab-extraido
          mkdir -p _site guitarlab-extraido
          unzip -q guitarlab-site.zip -d guitarlab-extraido
          cp -R guitarlab-extraido/guitarlab/. _site/
          touch _site/.nojekyll
      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
